    <!-- Detalhes extras -->
    <text x="0" y="460" class="mono text-green" font-size="14">Karate // Redteam // Pwed404</text>
  </g>

  <!-- ================= COLUNA DIREITA: FASTFETCH (RETRO MIX) ================= -->
  <g transform="translate(620, 70)">
    <text x="0" y="0" class="mono text-cyan text-bold" font-size="14">pwed404@archlinux</text>
    <text x="0" y="18" class="mono text-cyan" font-size="14">-------------------</text>
    
    <text x="0" y="38" class="mono" font-size="13">
      <tspan class="text-green text-bold">OS:</tspan> <tspan class="text-white">Arch Linux x86_64 / Windows 95</tspan>
    </text>
    <text x="0" y="56" class="mono" font-size="13">
      <tspan class="text-green text-bold">Host:</tspan> <tspan class="text-white">Pwed404 - RedTeam</tspan>
    </text>
    <text x="0" y="74" class="mono" font-size="13">
      <tspan class="text-green text-bold">Kernel:</tspan> <tspan class="text-white">6.8.9-arch1-1 / 4.00.950</tspan>
    </text>
    <text x="0" y="92" class="mono" font-size="13">
      <tspan class="text-green text-bold">Uptime:</tspan> <tspan class="text-white">42 years, 13 days, 7 hours</tspan>
    </text>
    <text x="0" y="110" class="mono" font-size="13">
      <tspan class="text-green text-bold">Packages:</tspan> <tspan class="text-white">1337 (pacman) + 69 (win95)</tspan>
    </text>
    <text x="0" y="128" class="mono" font-size="13">
      <tspan class="text-green text-bold">Shell:</tspan> <tspan class="text-white">zsh 5.9 / command.com</tspan>
    </text>
    <text x="0" y="146" class="mono" font-size="13">
      <tspan class="text-green text-bold">Resolution:</tspan> <tspan class="text-white">800x600 (16-bit color)</tspan>
    </text>
    <text x="0" y="164" class="mono" font-size="13">
      <tspan class="text-green text-bold">DE:</tspan> <tspan class="text-white">XFCE 4.20 / Windows 95 Explorer</tspan>
    </text>
    <text x="0" y="182" class="mono" font-size="13">
      <tspan class="text-green text-bold">WM:</tspan> <tspan class="text-white">Xfwm4 (X11) / Stacker</tspan>
    </text>
    <text x="0" y="200" class="mono" font-size="13">
      <tspan class="text-green text-bold">Theme:</tspan> <tspan class="text-white">Windows 95 [Classic]</tspan>
    </text>
    <text x="0" y="218" class="mono" font-size="13">
      <tspan class="text-green text-bold">Icons:</tspan> <tspan class="text-white">Windows 95 Icons</tspan>
    </text>
    <text x="0" y="236" class="mono" font-size="13">
      <tspan class="text-green text-bold">Terminal:</tspan> <tspan class="text-white">xfce4-terminal 1.2.0 / cmd.exe</tspan>
    </text>
    <text x="0" y="254" class="mono" font-size="13">
      <tspan class="text-green text-bold">CPU:</tspan> <tspan class="text-white">Intel Pentium 133 MHz (1) @ 133 MHz</tspan>
    </text>
    <text x="0" y="272" class="mono" font-size="13">
      <tspan class="text-green text-bold">GPU:</tspan> <tspan class="text-white">S3 Trio64V+ (2MB VRAM)</tspan>
    </text>
    <text x="0" y="290" class="mono" font-size="13">
      <tspan class="text-green text-bold">Memory:</tspan> <tspan class="text-white">8 MB / 16 MB (50%)</tspan>
    </text>
    <text x="0" y="308" class="mono" font-size="13">
      <tspan class="text-green text-bold">Locale:</tspan> <tspan class="text-white">en_US.CP437</tspan>
    </text>

    <!-- Bloco de Cores -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="25" height="15" fill="#555555" stroke="#000" stroke-width="1"/>
      <rect x="25" y="0" width="25" height="15" fill="#f85149" stroke="#000" stroke-width="1"/>
      <rect x="50" y="0" width="25" height="15" fill="#39d353" stroke="#000" stroke-width="1"/>
      <rect x="75" y="0" width="25" height="15" fill="#d29922" stroke="#000" stroke-width="1"/>
      <rect x="100" y="0" width="25" height="15" fill="#58a6ff" stroke="#000" stroke-width="1"/>
      <rect x="125" y="0" width="25" height="15" fill="#bc8cff" stroke="#000" stroke-width="1"/>
      <rect x="150" y="0" width="25" height="15" fill="#00ffff" stroke="#000" stroke-width="1"/>
      <rect x="175" y="0" width="25" height="15" fill="#ffffff" stroke="#000" stroke-width="1"/>
