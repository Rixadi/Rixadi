<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .bg { fill: #0d1117; }
      .term-bg { fill: #161b22; }
      .term-header { fill: #21262d; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .text-green { fill: #39d353; }
      .text-white { fill: #c9d1d9; }
      .text-cyan { fill: #58a6ff; }
      .text-yellow { fill: #d29922; }
      .text-red { fill: #f85149; }
      .text-magenta { fill: #bc8cff; }
      .text-bold { font-weight: bold; }
    </style>
  </defs>

  <!-- Fundo Principal -->
  <rect width="1100" height="580" class="bg" rx="10"/>
  
  <!-- Borda do Terminal -->
  <rect x="10" y="10" width="1080" height="560" fill="none" stroke="#39d353" stroke-width="2" rx="8"/>

  <!-- Barra de Título do Terminal -->
  <rect x="20" y="20" width="1060" height="30" class="term-header" rx="5"/>
  <circle cx="40" cy="35" r="6" class="btn-red"/>
  <circle cx="60" cy="35" r="6" class="btn-yellow"/>
  <circle cx="80" cy="35" r="6" class="btn-green"/>
  <text x="110" y="39" class="mono text-white" font-size="12">[pwed404@archlinux ~]$ fastfetch --win95</text>

